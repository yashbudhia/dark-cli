[project]
name = "dark-cli"
version = "0.4.0"
license = "MIT"
description = "AI red-teaming CLI for authorized security testing — verified, replayable findings"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "prompt-toolkit>=3.0.52,<4",
  "python-dotenv>=1.0",
  "mcp>=1.13,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dark_cli"]

[project.scripts]
dark = "dark_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
