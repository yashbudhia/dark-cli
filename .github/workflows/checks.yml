name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -e './backend[dev]' -e './cli[dev]' uv==0.13.6
      - run: python -m pytest backend/tests cli/tests scripts/tests -q --tb=short
      - run: python -m ruff check backend cli scripts/service.py scripts/tests
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npm ci --ignore-scripts && npm run prepublishOnly
        working-directory: npm
