[project]
name = "dark-cli-backend"
version = "0.1.0"
description = "API + store for dark-cli: runs, verified findings, refusal telemetry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pymongo>=4.11,<5",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mongomock>=4.3,<5", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
