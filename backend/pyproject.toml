[project]
name = "dark-cli-backend"
version = "0.1.0"
description = "API + store for dark-cli: runs, verified findings, refusal telemetry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
